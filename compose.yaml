services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: alugai
      POSTGRES_USER: alugai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-alugai_local}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alugai -d alugai"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
