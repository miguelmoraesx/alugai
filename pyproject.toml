[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "alugai-collector"
version = "0.1.0"
description = "Coletor incremental de referências de imóveis"
requires-python = ">=3.11"
dependencies = ["httpx>=0.28,<1", "beautifulsoup4>=4.13,<5", "protego>=0.4,<1", "SQLAlchemy>=2.0,<3", "psycopg[binary]>=3.2,<4", "filelock>=3.18,<4", "alembic>=1.13,<2", "defusedxml>=0.7,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
alugai = "alugai.cli:main"

[tool.setuptools.packages.find]
include = ["alugai*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
